name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8 .
      - name: Tests unitaires + couverture
        run: pytest --cov=. --cov-report=term-missing

  integration:
    name: Backend · tests sur MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jobaggregator
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RUN_DB_TESTS: "1"
      DB_HOST: 127.0.0.1
      MYSQL_DATABASE: jobaggregator
      MYSQL_USER: ci
      MYSQL_PASSWORD: ci-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m integration -v

  frontend:
    name: Frontend · lint + types + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker Compose · démarrage complet
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-secret-not-for-production
      WARMUP_MODEL: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Valider docker-compose.yml
        run: docker compose config --quiet
      - name: Construire et démarrer la stack (attend les healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Tests de fumée à travers Nginx
        run: |
          set -e
          curl -fsS http://localhost:8082/api/health
          test "$(curl -fsS http://localhost:8082/api/dashboard/jobs | jq length)" -gt 0
          curl -fsS -o /dev/null -w "register %{http_code}\n" -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"ci-password-123","nom":"CI"}' \
            http://localhost:8082/api/register
          TOKEN=$(curl -fsS -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' \
            http://localhost:8082/api/login | jq -r .access_token)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8082/api/applications/ci@example.com
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            http://localhost:8082/api/admin/users)" = 403
          curl -fsS http://localhost:8082/ | grep -q '<div id="root">'
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêt
        if: always()
        run: docker compose down -v
