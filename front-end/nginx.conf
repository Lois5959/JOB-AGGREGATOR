# Nginx sert le build React et relaie /api vers FastAPI (seul point d'entrée public).
server_tokens off;

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# En-têtes de sécurité, repris dans chaque location qui ajoute ses propres en-têtes.
map $uri $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' https://api-adresse.data.gouv.fr https://nominatim.openstreetmap.org; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Deux fichiers de 5 Mo max (CV + lettre) + les champs du formulaire.
    client_max_body_size 12m;

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fichiers versionnés par Vite (nom avec hash) : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Application monopage : toute route inconnue renvoie index.html (jamais mis en cache).
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # On écrase l'en-tête au lieu de le compléter : un client ne peut pas se faire passer
        # pour une autre IP et contourner la limite de tentatives de connexion / fail2ban.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le premier appel aux recommandations peut charger le modèle d'IA.
        proxy_read_timeout 120s;
    }

    # Sonde de vie du conteneur (healthcheck Docker).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
